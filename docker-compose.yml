# OpenCloud local stack. Brings up Postgres and Redis, runs the Bun and Better
# Auth migrations, then starts the Go API, worker, and the Next.js dashboard.
# Prometheus/Grafana are added later (see ROADMAP.md / docs/INFRASTRUCTURE.md).
#
#   docker compose up --build
#
# Compose reads interpolation values from .env (copy from .env.example), while
# each service receives only its explicit allowlist below.

name: opencloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opencloud
      POSTGRES_PASSWORD: opencloud
      POSTGRES_DB: opencloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ stores data in version-specific subdirs; the mount goes at
      # /var/lib/postgresql (not /var/lib/postgresql/data — that errors on 18+).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencloud -d opencloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["/app/migrate", "up"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot Better Auth migration for the auth.* identity tables (ADR 0006).
  # Runs after Bun's migrate has created the empty `auth` schema.
  auth-migrate:
    build:
      context: .
      target: auth-migrate
    environment:
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (copy .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://dashboard:3000/api/auth/jwks}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3000}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      dashboard:
        condition: service_started
    # No container healthcheck: the distroless image has no shell/curl. Liveness
    # and readiness are exposed at /healthz and /readyz for orchestrators and
    # load balancers to probe directly (docs/INFRASTRUCTURE.md §7).

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PROVISIONER_BACKEND: ${PROVISIONER_BACKEND:-fake}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      CADDY_API_URL: ${CADDY_API_URL:-http://127.0.0.1:2019}
      CADDY_SERVER_ID: ${CADDY_SERVER_ID:-srv0}
      SITE_DEFAULT_IMAGE: ${SITE_DEFAULT_IMAGE:-opencloud/site-static:phase2}
      HESTIA_API_URL: ${HESTIA_API_URL:-}
      HESTIA_ACCESS_KEY: ${HESTIA_ACCESS_KEY:-}
      HESTIA_SECRET_KEY: ${HESTIA_SECRET_KEY:-}
      HESTIA_API_KEY: ${HESTIA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Opt-in encrypted control-plane backups. Start explicitly with:
  # docker compose --profile backup up -d control-plane-backup
  # Production key material must come from an orchestrator secret, never .env.
  control-plane-backup:
    profiles: ["backup"]
    build:
      context: ./backend
      target: backup
    command: ["/app/control-plane-backup", "schedule"]
    environment:
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BACKUP_ENCRYPTION_KEY: ${CONTROL_PLANE_BACKUP_KEY:-}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${CONTROL_PLANE_BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${CONTROL_PLANE_BACKUP_INTERVAL_SECONDS:-86400}
      RESTORE_TEMP_DIR: /tmp
    volumes:
      - control_plane_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=0700,uid=70,gid=70
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      target: runner
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (copy .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      API_URL: http://api:8080
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  control_plane_backups:
