# OpenCloud local stack. Brings up Postgres and Redis, runs migrations, then
# starts the Go API and worker. Frontend and Prometheus/Grafana are added later
# (see ROADMAP.md Phase 0 / docs/INFRASTRUCTURE.md).
#
#   docker compose up --build
#
# Compose reads interpolation values from .env (copy from .env.example), while
# each service receives only its explicit allowlist below.

name: opencloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opencloud
      POSTGRES_PASSWORD: opencloud
      POSTGRES_DB: opencloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ stores data in version-specific subdirs; the mount goes at
      # /var/lib/postgresql (not /var/lib/postgresql/data — that errors on 18+).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencloud -d opencloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["/app/migrate", "up"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      HESTIA_API_URL: ${HESTIA_API_URL:-}
      HESTIA_API_KEY: ${HESTIA_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # No container healthcheck: the distroless image has no shell/curl. Liveness
    # and readiness are exposed at /healthz and /readyz for orchestrators and
    # load balancers to probe directly (docs/INFRASTRUCTURE.md §7).

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HESTIA_API_URL: ${HESTIA_API_URL:-}
      HESTIA_API_KEY: ${HESTIA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
