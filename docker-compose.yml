# OpenCloud local stack. Brings up Postgres and Redis, runs the Bun and Better
# Auth migrations, then starts the Go API, worker, Next.js dashboard, and the
# tenant-filtered Loki/Alloy customer logging path. Prometheus/Grafana remain
# later observability work (see ROADMAP.md / docs/INFRASTRUCTURE.md).
#
#   docker compose up --build
#
# Compose reads interpolation values from .env (copy from .env.example), while
# each service receives only its explicit allowlist below.

name: opencloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: opencloud
      POSTGRES_PASSWORD: opencloud
      POSTGRES_DB: opencloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ stores data in version-specific subdirs; the mount goes at
      # /var/lib/postgresql (not /var/lib/postgresql/data — that errors on 18+).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencloud -d opencloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: ${CUSTOMER_MARIADB_HOST:-mariadb}
      PMA_PORT: ${CUSTOMER_MARIADB_PORT:-3306}
    ports:
      - "127.0.0.1:8081:80"
    profiles: ["phpmyadmin"]

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Alloy never receives the Docker socket. This allowlisted proxy exposes only
  # read operations needed for container discovery/log reads; all write APIs
  # remain disabled.
  docker-log-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    expose:
      - "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.2
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      docker-log-proxy:
        condition: service_started
      loki:
        condition: service_started

  migrate:
    build: ./backend
    command: ["/app/migrate", "up"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      MIGRATION_MAINTENANCE_ACK: ${MIGRATION_MAINTENANCE_ACK:-}
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot Better Auth migration for the auth.* identity tables (ADR 0006).
  # Runs after Bun's migrate has created the empty `auth` schema.
  auth-migrate:
    build:
      context: .
      target: auth-migrate
    environment:
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (copy .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://dashboard:3000/api/auth/jwks}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:3000}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      SITE_DOMAIN_SUFFIX: ${SITE_DOMAIN_SUFFIX:-}
      CUSTOMER_DATABASES_ENABLED: ${CUSTOMER_DATABASES_ENABLED:-false}
      CUSTOMER_DATABASE_CREDENTIAL_KEY: ${CUSTOMER_DATABASE_CREDENTIAL_KEY:-}
      CUSTOMER_POSTGRES_HOST: ${CUSTOMER_POSTGRES_HOST:-}
      CUSTOMER_POSTGRES_PORT: ${CUSTOMER_POSTGRES_PORT:-5432}
      CUSTOMER_MARIADB_HOST: ${CUSTOMER_MARIADB_HOST:-}
      CUSTOMER_MARIADB_PORT: ${CUSTOMER_MARIADB_PORT:-3306}
      CUSTOMER_DATABASE_TLS_REQUIRED: ${CUSTOMER_DATABASE_TLS_REQUIRED:-true}
      DOMAINS_ENABLED: ${DOMAINS_ENABLED:-false}
      DOMAIN_VERIFICATION_KEY: ${DOMAIN_VERIFICATION_KEY:-}
      DOMAIN_INGRESS_IPV4: ${DOMAIN_INGRESS_IPV4:-}
      DOMAIN_DNS_RESOLVER: ${DOMAIN_DNS_RESOLVER:-1.1.1.1:53}
      CLOUDFLARE_API_ENABLED: ${CLOUDFLARE_API_ENABLED:-false}
      LOGS_ENABLED: ${LOGS_ENABLED:-true}
      LOGS_LOKI_URL: ${LOGS_LOKI_URL:-http://loki:3100}
      LOGS_QUERY_TIMEOUT_SECONDS: ${LOGS_QUERY_TIMEOUT_SECONDS:-10}
      LOGS_POLL_INTERVAL_SECONDS: ${LOGS_POLL_INTERVAL_SECONDS:-2}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      dashboard:
        condition: service_started
    # No container healthcheck: the distroless image has no shell/curl. Liveness
    # and readiness are exposed at /healthz and /readyz for orchestrators and
    # load balancers to probe directly (docs/INFRASTRUCTURE.md §7).

  worker:
    build: ./backend
    command: ["/app/worker"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PROVISIONER_BACKEND: ${PROVISIONER_BACKEND:-fake}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      CADDY_API_URL: ${CADDY_API_URL:-http://127.0.0.1:2019}
      CADDY_SERVER_ID: ${CADDY_SERVER_ID:-srv0}
      SITE_DEFAULT_IMAGE: ${SITE_DEFAULT_IMAGE:-opencloud/site-static:phase2}
      SITE_DOMAIN_SUFFIX: ${SITE_DOMAIN_SUFFIX:-}
      HESTIA_API_URL: ${HESTIA_API_URL:-}
      HESTIA_ACCESS_KEY: ${HESTIA_ACCESS_KEY:-}
      HESTIA_SECRET_KEY: ${HESTIA_SECRET_KEY:-}
      HESTIA_API_KEY: ${HESTIA_API_KEY:-}
      CUSTOMER_DATABASES_ENABLED: ${CUSTOMER_DATABASES_ENABLED:-false}
      CUSTOMER_DATABASE_CREDENTIAL_KEY: ${CUSTOMER_DATABASE_CREDENTIAL_KEY:-}
      CUSTOMER_POSTGRES_ADMIN_URL: ${CUSTOMER_POSTGRES_ADMIN_URL:-}
      CUSTOMER_POSTGRES_HOST: ${CUSTOMER_POSTGRES_HOST:-}
      CUSTOMER_POSTGRES_PORT: ${CUSTOMER_POSTGRES_PORT:-5432}
      CUSTOMER_MARIADB_ADMIN_DSN: ${CUSTOMER_MARIADB_ADMIN_DSN:-}
      CUSTOMER_MARIADB_HOST: ${CUSTOMER_MARIADB_HOST:-}
      CUSTOMER_MARIADB_PORT: ${CUSTOMER_MARIADB_PORT:-3306}
      CUSTOMER_DATABASE_TLS_REQUIRED: ${CUSTOMER_DATABASE_TLS_REQUIRED:-true}
      DOMAINS_ENABLED: ${DOMAINS_ENABLED:-false}
      DOMAIN_VERIFICATION_KEY: ${DOMAIN_VERIFICATION_KEY:-}
      DOMAIN_INGRESS_IPV4: ${DOMAIN_INGRESS_IPV4:-}
      DOMAIN_DNS_RESOLVER: ${DOMAIN_DNS_RESOLVER:-1.1.1.1:53}
      CLOUDFLARE_API_ENABLED: ${CLOUDFLARE_API_ENABLED:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-rustfsadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      STORAGE_S3_USE_PATH_STYLE: ${STORAGE_S3_USE_PATH_STYLE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Opt-in encrypted control-plane backups. Start explicitly with:
  # docker compose --profile backup up -d control-plane-backup
  # Production key material must come from an orchestrator secret, never .env.
  control-plane-backup:
    profiles: ["backup"]
    build:
      context: ./backend
      target: backup
    command: ["/app/control-plane-backup", "schedule"]
    environment:
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BACKUP_ENCRYPTION_KEY: ${CONTROL_PLANE_BACKUP_KEY:-}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${CONTROL_PLANE_BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${CONTROL_PLANE_BACKUP_INTERVAL_SECONDS:-86400}
      RESTORE_TEMP_DIR: /tmp
    volumes:
      - control_plane_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=0700,uid=70,gid=70
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      target: runner
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgres://opencloud:opencloud@postgres:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (copy .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      API_URL: http://api:8080
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  control_plane_backups:
  loki_data:
  alloy_data:
  rustfs_data:
