name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opencloud
          POSTGRES_PASSWORD: opencloud
          POSTGRES_DB: opencloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencloud -d opencloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://opencloud:opencloud@localhost:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      ENV: test
      MAIL_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: public domain migrations
        run: |
          for migration in backend/migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: better-auth migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS auth'
          npm run auth:migrate
          npm run auth:migrate
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'auth'")" -ge 4
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('user', 'session', 'account', 'verification')")" -eq 0
      - run: npm run test:auth
      - run: npm run auth:check-providers
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high

  # Backend checks and migration verification; see docs/DEPLOYMENT.md §2.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opencloud
          POSTGRES_PASSWORD: opencloud
          POSTGRES_DB: opencloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencloud -d opencloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 spike shell tests
        working-directory: .
        run: |
          test -x deploy/spikes/docker-caddy/run.sh
          test -x deploy/spikes/docker-caddy/run_test.sh
          bash deploy/spikes/docker-caddy/run_test.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin golangci-lint v2: action v6 + "latest" resolved to v1.x built with
          # Go 1.24, which cannot load config targeting Go 1.26 (backend/.golangci.yml).
          version: v2.12.2
          working-directory: backend
      - run: go vet ./...
      - run: go test ./...
      - name: migration round trip
        env:
          DATABASE_URL: postgres://opencloud:opencloud@localhost:5432/opencloud?sslmode=disable
        run: |
          go run ./cmd/migrate up
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) = count(DISTINCT group_id) FROM bun_migrations")" = "t"
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges > /tmp/schema-up.sql
          sed -i '/^\\restrict /d; /^\\unrestrict /d' /tmp/schema-up.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.accounts (id, name, status)
          VALUES ('00000000-0000-0000-0000-000000000021', 'migration sentinel', 'active');
          INSERT INTO public.account_memberships (account_id, user_id, role, status)
          VALUES ('00000000-0000-0000-0000-000000000021', 'migration-sentinel-user', 'customer', 'active');
          INSERT INTO public.audit_logs (account_id, actor_id, action, target)
          VALUES ('00000000-0000-0000-0000-000000000021', 'migration-sentinel-user', 'migration.sentinel', 'migration-sentinel-user');
          SQL
          go run ./cmd/migrate up
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges > /tmp/schema-idempotent.sql
          sed -i '/^\\restrict /d; /^\\unrestrict /d' /tmp/schema-idempotent.sql
          diff -u /tmp/schema-up.sql /tmp/schema-idempotent.sql
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.account_memberships WHERE user_id='migration-sentinel-user'")" -eq 1
          go run ./cmd/migrate down
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.account_memberships WHERE user_id='migration-sentinel-user'")" -eq 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.audit_logs WHERE action='migration.sentinel'")" -eq 1
          go run ./cmd/migrate up
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges > /tmp/schema-roundtrip.sql
          sed -i '/^\\restrict /d; /^\\unrestrict /d' /tmp/schema-roundtrip.sql
          diff -u /tmp/schema-up.sql /tmp/schema-roundtrip.sql
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('account_memberships','audit_logs','auth_token_consumptions')")" -eq 3
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.accounts WHERE id='00000000-0000-0000-0000-000000000021'")" -eq 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.audit_logs WHERE action='migration.sentinel'")" -eq 1
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.audit_logs SET action='tampered' WHERE action='migration.sentinel'"; then
            echo "audit_logs update unexpectedly succeeded"
            exit 1
          fi
      - name: account service integration
        env:
          DATABASE_URL: postgres://opencloud:opencloud@localhost:5432/opencloud?sslmode=disable
        run: go test ./internal/service/ ./internal/middleware/ ./internal/handler/ -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: docker build
        run: docker build -t opencloud-backend:ci .
