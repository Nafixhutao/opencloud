name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run auth tests
        run: npm run test:auth
      - name: Run linting
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production
        # Build-time only placeholders. Next.js evaluates API route modules during
        # "Collecting page data", which imports lib/auth and lib/mail — those modules
        # validate required env vars. ENV=development keeps lib/mail's production guard
        # satisfied (defaults MAIL_PROVIDER to "log"). No DB/SMTP connection is made
        # during the build; these values are never used at runtime.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          ENV: development
        run: npm run build

  # Backend checks — gofmt, golangci-lint, vet, and unit tests. Integration tests
  # (those needing DATABASE_URL / Docker / S3) auto-skip when their env vars are
  # absent, so go test ./... runs cleanly without service containers. See
  # docs/CONTRIBUTING.md §6 and docs/TESTING.md for the documented gate set.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - name: Check gofmt formatting
        run: test -z "$(gofmt -l .)" || { echo "Files not gofmt-formatted:"; gofmt -l .; exit 1; }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Build golangci-lint from source with the runner's Go toolchain.
          # The prebuilt v2.12.2 binary is built with Go 1.24 and cannot load
          # configs targeting Go 1.26.5 ("Go language version ... is lower than
          # the targeted Go version"). goinstall recompiles against Go 1.26.5.
          install-mode: goinstall
          working-directory: backend
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
