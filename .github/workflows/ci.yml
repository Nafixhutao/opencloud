name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run auth tests
        run: npm run test:auth
      - name: Run linting
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production
        run: npm run build
