name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opencloud
          POSTGRES_PASSWORD: opencloud
          POSTGRES_DB: opencloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencloud -d opencloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://opencloud:opencloud@localhost:5432/opencloud?sslmode=disable
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      ENV: test
      MAIL_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run auth tests
        run: npm run test:auth
      - name: Run linting
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production
        run: npm run build

  # Backend checks; simplified for reliability.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./internal/service/ ./internal/repository/ -count=1
      - name: docker build
        run: docker build -t opencloud-backend:ci .
